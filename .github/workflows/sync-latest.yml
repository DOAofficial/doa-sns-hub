name: Sync latest SNS posts

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    paths:
      - ".github/workflows/sync-latest.yml"
      - "scripts/sync-latest.mjs"

permissions:
  contents: write

concurrency:
  group: sync-latest-sns
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Instagram, TikTok, YouTube, X and Threads
        run: node scripts/sync-latest.mjs
        env:
          LATEST_POSTS_API: https://script.google.com/macros/s/AKfycbyHYoykgR_MZIfPtTWZODIXmCX1cmn9XzzKryyejbcjScFdhSnUNVwRQUX1G8ZNz1wU/exec
          X_HANDLE: doa07382711

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- latest-posts.json; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-posts.json
          git commit -m "Auto-sync latest SNS posts"
          git push
